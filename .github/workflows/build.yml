name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn -B compile

      - name: Run unit tests
        # Excludes LoginFlowAutomationTest: it drives a real browser against a
        # running Tomcat + MySQL instance, which this CI runner doesn't have.
        # AppointmentServiceTest and BillingServiceTest are pure Mockito-based
        # unit tests and need no external services.
        run: mvn -B test -Dtest=AppointmentServiceTest,BillingServiceTest
